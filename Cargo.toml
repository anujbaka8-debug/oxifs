[package]
name = "oxifs"
version = "0.2.0"
edition = "2021"

[[bin]]
name = "oxifs"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.29"
sysinfo = "0.31"
ignore = "0.4"
trash = "5"
open = "5"
anyhow = "1"
chrono = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
